# Test automatici a ogni push e pull request.
name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot

      - name: Importa il progetto
        run: ./godot --headless --import

      - name: Test del generatore
        run: ./godot --headless -s res://tests/test_generator.gd

      - name: Avvio del gioco (controllo errori)
        run: |
          ./godot --headless --quit-after 120 2>&1 | tee run.log
          ! grep -E "SCRIPT ERROR|Parse Error" run.log
